{% extends "base.html" %}

{% block title %}Login — CodeCoach{% endblock %}

{% block body %}
<main class="mx-auto flex max-w-7xl items-center justify-center px-4 py-20 sm:px-6">
    <div class="w-full max-w-md relative">
        <div class="absolute inset-0 bg-gradient-to-r from-indigo-600/20 to-purple-600/20 blur-xl rounded-2xl"></div>
        <div class="relative rounded-2xl border border-slate-700/50 bg-[#0f172a]/80 backdrop-blur-xl p-8 shadow-2xl">
            <h2 class="text-3xl font-extrabold text-white text-center mb-2">Welcome Back</h2>
            <p class="text-sm text-slate-400 text-center mb-8">Sign in to continue your learning journey.</p>
            <form method="POST" action="{{ url_for('login') }}" class="flex flex-col gap-5">
                <div>
                    <label for="email" class="mb-1.5 block text-sm font-medium text-slate-300">Email Address</label>
                    <input type="email" id="email" name="email" required
                           class="w-full rounded-xl border border-slate-700 bg-slate-900/50 p-3.5 text-slate-200 placeholder-slate-500 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
                           placeholder="you@example.com">
                </div>
                <div>
                    <label for="password" class="mb-1.5 block text-sm font-medium text-slate-300">Password</label>
                    <input type="password" id="password" name="password" required
                           class="w-full rounded-xl border border-slate-700 bg-slate-900/50 p-3.5 text-slate-200 placeholder-slate-500 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
                           placeholder="••••••••">
                </div>
                <button type="submit"
                        class="mt-2 w-full rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 py-3.5 text-sm font-bold text-white shadow-lg shadow-indigo-600/25 transition hover:scale-[1.02]">
                    Log In
                </button>
            </form>
            <p class="mt-8 text-center text-sm text-slate-400 border-t border-slate-800 pt-6">
                Don't have an account? <a href="{{ url_for('register') }}" class="font-bold text-indigo-400 hover:text-indigo-300 transition">Sign up</a>
            </p>
        </div>
    </div>
</main>
{% endblock %}

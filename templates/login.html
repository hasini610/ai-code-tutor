{% extends "base.html" %}

{% block title %}Login — DSA Coding Platform{% endblock %}

{% block body %}
<main class="mx-auto flex max-w-7xl items-center justify-center px-4 py-20 sm:px-6">
    <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/50 p-8 shadow-2xl shadow-black/40">
        <h2 class="text-2xl font-bold text-white text-center mb-6">Welcome Back</h2>
        <form method="POST" action="{{ url_for('login') }}" class="flex flex-col gap-4">
            <div>
                <label for="email" class="mb-1 block text-sm font-medium text-slate-400">Email Address</label>
                <input type="email" id="email" name="email" required
                       class="w-full rounded-lg border border-slate-800 bg-slate-950/60 p-3 text-slate-200 placeholder-slate-600 focus:border-indigo-500 focus:outline-none transition"
                       placeholder="you@example.com">
            </div>
            <div>
                <label for="password" class="mb-1 block text-sm font-medium text-slate-400">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full rounded-lg border border-slate-800 bg-slate-950/60 p-3 text-slate-200 placeholder-slate-600 focus:border-indigo-500 focus:outline-none transition"
                       placeholder="••••••••">
            </div>
            <button type="submit"
                    class="mt-4 w-full rounded-lg bg-indigo-600 py-3 text-sm font-bold text-white shadow-md shadow-indigo-600/25 transition hover:bg-indigo-500">
                Log In
            </button>
        </form>
        <p class="mt-6 text-center text-sm text-slate-400">
            Don't have an account? <a href="{{ url_for('register') }}" class="font-medium text-indigo-400 hover:text-indigo-300">Sign up</a>
        </p>
    </div>
</main>
{% endblock %}

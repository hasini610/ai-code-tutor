<script>
    let storedHints = {};
    let storedSolution = '';
    let hasRunCode = false;

    function detectLanguageMismatch(code, selectedLanguage) {
        const lines = code.split('\n').filter(l => l.trim().length > 0);
        if (lines.length < 5) return null; // Ignore short snippets

        let pythonScore = 0;
        let javaScore = 0;
        let cScore = 0;

        const pythonSignatures = [
            /def\s+\w+\(/,
            /import\s+[a-zA-Z_]/,
            /elif\s+/,
            /:\s*$/, // colon at end of lines
            /print\(/,
            /None/,
            /True/,
            /False/,
            /class\s+\w+(\(\w+\))?:/,
            /self\./
        ];

        const javaSignatures = [
            /public\s+class\s+/,
            /System\.out\.print/,
            /public\s+static\s+void\s+main/,
            /import\s+java\./,
            /new\s+[A-Z]\w*\(/,
            /String\[\]\s+args/,
            /class\s+\w+\s+implements\s+/,
            /class\s+\w+\s+extends\s+/
        ];

        const cSignatures = [
            /#include\s*</,
            /printf\(/,
            /scanf\(/,
            /int\s+main\s*\(/,
            /struct\s+\w+\s*\{/,
            /typedef\s+struct/
        ];

        lines.forEach(line => {
            const trimmed = line.trim();
            if (trimmed.startsWith('#') || trimmed.startsWith('//') || trimmed.startsWith('/*')) return;

            pythonSignatures.forEach(sig => { if (sig.test(line)) pythonScore++; });
            javaSignatures.forEach(sig => { if (sig.test(line)) javaScore++; });
            cSignatures.forEach(sig => { if (sig.test(line)) cScore++; });
        });

        const scores = { 'python': pythonScore, 'java': javaScore, 'c': cScore };
        const totalScore = pythonScore + javaScore + cScore;

        if (totalScore === 0) return null;

        let maxLang = null;
        let maxScore = 0;
        for (const [lang, score] of Object.entries(scores)) {
            if (score > maxScore) {
                maxScore = score;
                maxLang = lang;
            }
        }

        if (maxLang && maxLang !== selectedLanguage && (maxScore / totalScore) > 0.60) {
            return maxLang;
        }

        return null;
    }

    let mismatchResolve = null;

    function ensureLanguageMismatchModal() {
        if (document.getElementById('languageMismatchModal')) return;

        const modalHtml = `
        <div id="languageMismatchModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/85 backdrop-blur-sm p-4">
            <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 shadow-2xl p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="mismatchModalContent">
                <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-amber-500/20 mb-4">
                    <span class="text-2xl">⚠️</span>
                </div>
                <h3 class="text-xl font-bold text-white mb-2">Language Mismatch?</h3>
                <p id="mismatchModalText" class="text-sm text-slate-300 mb-6 leading-relaxed">
                    Your code looks like it might be in another language. Are you sure you want to proceed?
                </p>
                <div class="flex flex-col gap-3">
                    <button id="mismatchConfirmBtn" class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 px-4 py-2.5 text-sm font-semibold text-white shadow-md shadow-indigo-600/25 transition">
                        Yes, run it anyway
                    </button>
                    <button id="mismatchCancelBtn" class="w-full rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 px-4 py-2.5 text-sm font-medium text-slate-300 hover:text-white transition">
                        No, let me change language
                    </button>
                </div>
            </div>
        </div>
        `;
        const div = document.createElement('div');
        div.innerHTML = modalHtml;
        document.body.appendChild(div.firstElementChild);
    }

    function showMismatchModal(detected, selected) {
        ensureLanguageMismatchModal();
        const modal = document.getElementById('languageMismatchModal');
        const content = document.getElementById('mismatchModalContent');
        const textEl = document.getElementById('mismatchModalText');

        const detName = detected.charAt(0).toUpperCase() + detected.slice(1);
        const selName = selected.charAt(0).toUpperCase() + selected.slice(1);

        textEl.innerHTML = `Your code looks like <strong>${detName}</strong>, but <strong>${selName}</strong> is selected. Are you sure you want to run it?`;

        modal.classList.remove('hidden');
        void modal.offsetWidth;
        content.classList.remove('scale-95', 'opacity-0');
        content.classList.add('scale-100', 'opacity-100');

        return new Promise((resolve) => {
            mismatchResolve = resolve;

            document.getElementById('mismatchConfirmBtn').onclick = function() {
                closeMismatchModal();
                resolve(true);
            };

            document.getElementById('mismatchCancelBtn').onclick = function() {
                closeMismatchModal();
                resolve(false);
            };
        });
    }

    function closeMismatchModal() {
        const modal = document.getElementById('languageMismatchModal');
        const content = document.getElementById('mismatchModalContent');
        if (!modal || !content) return;

        content.classList.remove('scale-100', 'opacity-100');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 200);
    }

    function getProblemStatement() {
        const el = document.getElementById('problemStatement');
        if (!el) return '';
        return el.tagName === 'TEXTAREA' ? el.value.trim() : (el.dataset.problemText || el.textContent || '').trim();
    }

    async function getHints() {
        const hintsSection = document.getElementById('hintsSection');
        const problemStatement = getProblemStatement();
        const myCode = document.getElementById('myCode').value.trim();
        const language = document.getElementById('languageSelect').value;
        const getHintBtn = document.getElementById('getHintBtn');

        if (!problemStatement && !myCode) {
            showInfoModal('Please enter a problem statement or your code to get hints.', 'warn', 'Missing Input');
            return;
        }

        if (!hasRunCode) {
            showInfoModal('Please run the code at least once before asking for hints.', 'info', 'Run Code First');
            return;
        }

        clearPreviousHints();

        getHintBtn.disabled = true;
        getHintBtn.textContent = 'Thinking...';
        getHintBtn.classList.add('opacity-75', 'cursor-not-allowed');

        try {
            const response = await fetch('/get-hints', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ problemStatement, userCode: myCode, language }),
            });

            const data = await response.json();

            if (response.ok) {
                if (data.status === 'correct') {
                    showCorrectCodeMessage(data.message);
                } else if (data.hint1) {
                    // Store all hints but only reveal hint 1
                    storedHints = { hint1: data.hint1, hint2: data.hint2, hint3: data.hint3 };
                    document.getElementById('hint1').textContent = storedHints.hint1;
                    hintsSection.classList.remove('hidden');
                    const h1Card = document.getElementById('hint1Card');
                    if (h1Card) h1Card.classList.remove('hidden');
                    const btn2 = document.getElementById('showHint2Btn');
                    if (btn2) btn2.classList.remove('hidden');
                    hintsSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    showInfoModal(data.error || 'Unexpected response from server. Please try again.', 'error', 'Error');
                }
            } else {
                showInfoModal(data.error || 'Failed to get hints. Please try again.', 'error', 'Error');
            }
        } catch (error) {
            showInfoModal(`Network Error: ${error.message}`, 'error', 'Network Error');
        } finally {
            getHintBtn.disabled = false;
            getHintBtn.textContent = 'Get Hint';
            getHintBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        }
    }

    async function runCode() {
        const myCode = document.getElementById('myCode').value.trim();
        const language = document.getElementById('languageSelect').value;
        const customInput = document.getElementById('customInput').value.trim();
        const runCodeBtn = document.getElementById('runCodeBtn');

        if (!myCode) {
            showInfoModal('Please enter some code to run.', 'warn', 'No Code Found');
            return;
        }

        const detected = detectLanguageMismatch(myCode, language);
        if (detected) {
            const confirmed = await showMismatchModal(detected, language);
            if (!confirmed) {
                return;
            }
        }

        clearExecutionOutput();

        runCodeBtn.disabled = true;
        runCodeBtn.textContent = 'Running...';
        runCodeBtn.classList.add('opacity-75', 'cursor-not-allowed');
        document.getElementById('executionLoading').classList.remove('hidden');
        document.getElementById('emptyOutput').classList.add('hidden');

        try {
            const response = await fetch('/run-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ source_code: myCode, language, stdin: customInput }),
            });
            const data = await response.json();
            if (response.ok) {
                hasRunCode = true;
                displayExecutionResults(data);
            } else {
                showError(data.error || 'Failed to run code. Please try again.');
            }
        } catch (error) {
            showError('Network error. Please check your connection and try again.');
        } finally {
            runCodeBtn.disabled = false;
            runCodeBtn.textContent = 'Run Code';
            runCodeBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            document.getElementById('executionLoading').classList.add('hidden');
        }
    }

    function displayExecutionResults(data) {
        document.getElementById('emptyOutput').classList.add('hidden');
        if (data.stdout && data.stdout.trim()) {
            const stdoutDiv = document.getElementById('stdout');
            stdoutDiv.querySelector('pre').textContent = data.stdout;
            stdoutDiv.classList.remove('hidden');
        }
        if (data.stderr && data.stderr.trim()) {
            const stderrDiv = document.getElementById('stderr');
            stderrDiv.querySelector('pre').textContent = data.stderr;
            stderrDiv.classList.remove('hidden');
        }
        if (data.compile_output && data.compile_output.trim()) {
            const compileDiv = document.getElementById('compileOutput');
            compileDiv.querySelector('pre').textContent = data.compile_output;
            compileDiv.classList.remove('hidden');
        }
        if (data.time || data.memory || data.exit_code !== undefined || data.status) {
            const timeVal = data.time ? (String(data.time).endsWith('s') ? data.time : `${data.time}s`) : 'N/A';
            document.getElementById('execTime').textContent = timeVal;
            document.getElementById('execMemory').textContent = data.memory ? `${data.memory} KB` : 'N/A';
            document.getElementById('exitCode').textContent = data.exit_code !== undefined ? data.exit_code : 'N/A';
            document.getElementById('executionInfo').classList.remove('hidden');
        }
    }

    function showError(message) {
        document.getElementById('emptyOutput').classList.add('hidden');
        document.getElementById('executionLoading').classList.add('hidden');
        const stderrDiv = document.getElementById('stderr');
        stderrDiv.querySelector('pre').textContent = message;
        stderrDiv.classList.remove('hidden');
    }

    function clearExecutionOutput() {
        document.getElementById('stdout').classList.add('hidden');
        document.getElementById('stderr').classList.add('hidden');
        document.getElementById('compileOutput').classList.add('hidden');
        document.getElementById('executionInfo').classList.add('hidden');
        document.getElementById('stdout').querySelector('pre').textContent = '';
        document.getElementById('stderr').querySelector('pre').textContent = '';
        document.getElementById('compileOutput').querySelector('pre').textContent = '';
        document.getElementById('emptyOutput').classList.remove('hidden');
    }

    function showHint(hintNumber) {
        if (hintNumber === 2) {
            const card2 = document.getElementById('hint2Card');
            if (card2) {
                if (storedHints && storedHints.hint2) {
                    document.getElementById('hint2').textContent = storedHints.hint2;
                }
                card2.classList.remove('hidden');
                const btn2 = document.getElementById('showHint2Btn');
                if (btn2) btn2.classList.add('hidden');
                const btn3 = document.getElementById('showHint3Btn');
                if (btn3) btn3.classList.remove('hidden');
                card2.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        } else if (hintNumber === 3) {
            const card3 = document.getElementById('hint3Card');
            if (card3) {
                if (storedHints && storedHints.hint3) {
                    document.getElementById('hint3').textContent = storedHints.hint3;
                }
                card3.classList.remove('hidden');
                const btn3 = document.getElementById('showHint3Btn');
                if (btn3) btn3.classList.add('hidden');
                card3.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
    }

    function showCorrectCodeMessage(message) {
        clearPreviousHints();
        document.getElementById('hintsSection').classList.add('hidden');
        document.getElementById('correctMessage').textContent = message || 'Your code is correct! Well done.';
        document.getElementById('correctSection').classList.remove('hidden');
        document.getElementById('correctSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function clearPreviousHints() {
        const correctSection = document.getElementById('correctSection');
        const hintsSection = document.getElementById('hintsSection');
        const hint1Card = document.getElementById('hint1Card');
        const hint2Card = document.getElementById('hint2Card');
        const hint3Card = document.getElementById('hint3Card');
        const showHint2Btn = document.getElementById('showHint2Btn');
        const showHint3Btn = document.getElementById('showHint3Btn');

        if (correctSection) correctSection.classList.add('hidden');
        if (hintsSection) hintsSection.classList.add('hidden');
        if (hint1Card) hint1Card.classList.add('hidden');
        if (hint2Card) hint2Card.classList.add('hidden');
        if (hint3Card) hint3Card.classList.add('hidden');
        if (showHint2Btn) showHint2Btn.classList.add('hidden');
        if (showHint3Btn) showHint3Btn.classList.add('hidden');

        storedHints = {};
        storedSolution = '';
    }
</script>
